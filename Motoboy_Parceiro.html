<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Central do Motoboy - Entregas Já</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #ffc107; text-shadow: 1px 1px 2px #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #ffc107; color: #333; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #e0a800; }
        #map { height: 400px; margin-top: 20px; border-radius: 8px; }
        .pedido-card { background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-left: 4px solid #ffc107; border-radius: 4px; }
        .btn-acao { background-color: #28a745; color: white; padding: 6px 12px; margin-top: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-concluir { background-color: #007bff; color: white; padding: 8px 15px; margin-top: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-sair { background-color: #dc3545; color: white; float: right; padding: 6px 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Central do Motoboy 🛵</h1>
        
        <div id="painel-login">
            <h3>Login do Motoboy</h3>
            <div class="form-group">
                <label>Utilizador:</label>
                <input type="text" id="usuario" placeholder="Seu utilizador">
            </div>
            <div class="form-group">
                <label>Palavra-passe:</label>
                <input type="password" id="senha" placeholder="Sua senha">
            </div>
            <button onclick="fazerLogin()">Entrar</button>
        </div>

        <div id="painel-conteudo" style="display:none;">
            <button class="btn-sair" onclick="fazerLogout()">Sair</button>
            <h2 id="titulo-motoboy">Bem-vindo</h2>
            
            <h3>Minha Entrega Atual / Em Curso</h3>
            <div id="pedido-atual">Nenhuma entrega em curso.</div>

            <h3>Pedidos Disponíveis para Aceitar</h3>
            <div id="lista-pedidos-disponiveis">A carregar pedidos...</div>
            
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let nomeMotoboy = "";
        let usuarioLogado = "";
        let map, marcadorLocalizacao = null;
        let watchId = null;
        let intervaloDados = null;

        const iconeMoto = L.divIcon({
            className: 'custom-div-icon',
            html: `<div style="background-color: #ffc107; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #333; font-size: 16px; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">🛵</div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        function inicializarMapa(lat = -26.115, lng = -48.618) {
            if (!map) {
                map = L.map('map').setView([lat, lng], 14);
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19, attribution: 'Tiles &copy; Esri'
                }).addTo(map);
            }
        }

        async function fazerLogin() {
            const usuarioInput = document.getElementById("usuario").value;
            const senhaInput = document.getElementById("senha").value;

            if(!usuarioInput || !senhaInput) {
                alert("Preencha o utilizador e a palavra-passe.");
                return;
            }

            const res = await fetch("/api/motoboy/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ usuario: usuarioInput, senha: senhaInput })
            });

            if (res.ok) {
                const data = await res.json();
                nomeMotoboy = data.nome;
                usuarioLogado = data.usuario;

                document.getElementById("painel-login").style.display = "none";
                document.getElementById("painel-conteudo").style.display = "block";
                document.getElementById("titulo-motoboy").innerText = `Motoboy: ${nomeMotoboy}`;
                
                inicializarMapa();
                carregarDadosMotoboy();
                intervaloDados = setInterval(carregarDadosMotoboy, 5000);
                iniciarRastreamentoGPS();
            } else {
                alert("Utilizador ou palavra-passe incorretos.");
            }
        }

        async function fazerLogout() {
            if (usuarioLogado) {
                await fetch("/api/motoboy/logout", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario: usuarioLogado })
                });
            }

            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (intervaloDados) clearInterval(intervaloDados);

            window.location.reload();
        }

        async function carregarDadosMotoboy() {
            const res = await fetch("/api/admin/dados-gerais");
            if (res.ok) {
                const data = await res.json();
                let htmlDisponiveis = "";
                let htmlAtual = "Nenhuma entrega em curso.";

                data.pedidos.forEach(p => {
                    if (p.status === 'Disponível') {
                        htmlDisponiveis += `<div class="pedido-card">
                            <strong>Recolha:</strong> ${p.endereco_recolha} <br>
                            <strong>Destino:</strong> ${p.endereco_destino} <br>
                            <strong>Taxa:</strong> R$ ${p.taxa_entrega} <br>
                            <button class="btn-acao" onclick="aceitarPedido('${p._id}')">Aceitar Entrega</button>
                        </div>`;
                    } else if (p.status === 'Em Entrega' && p.motoboy_nome === nomeMotoboy) {
                        htmlAtual = `<div class="pedido-card" style="border-left-color: #007bff;">
                            <strong>Destino:</strong> ${p.endereco_destino} <br>
                            <strong>Descrição:</strong> ${p.descricao_pedido || 'N/A'} <br>
                            <strong>Status:</strong> Em Andamento 🚀 <br>
                            <button class="btn-concluir" onclick="concluirPedido('${p._id}')">✅ Confirmar Conclusão da Entrega</button>
                        </div>`;
                    }
                });

                document.getElementById("lista-pedidos-disponiveis").innerHTML = htmlDisponiveis || "Não há pedidos disponíveis.";
                document.getElementById("pedido-atual").innerHTML = htmlAtual;
            }
        }

        async function aceitarPedido(pedidoId) {
            const res = await fetch(`/api/pedidos/${pedidoId}/status`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: "Em Entrega", motoboy_nome: nomeMotoboy })
            });
            if (res.ok) {
                alert("Entrega aceite com sucesso!");
                carregarDadosMotoboy();
            } else {
                alert("Erro ao aceitar pedido.");
            }
        }

        async function concluirPedido(pedidoId) {
            const res = await fetch(`/api/pedidos/${pedidoId}/status`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: "Concluído", motoboy_nome: nomeMotoboy })
            });
            if (res.ok) {
                alert("Entrega concluída com sucesso! Parabéns!");
                carregarDadosMotoboy();
            } else {
                alert("Erro ao concluir pedido.");
            }
        }

        function iniciarRastreamentoGPS() {
            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const latLng = [lat, lng];

                    if (marcadorLocalizacao) {
                        marcadorLocalizacao.setLatLng(latLng);
                    } else {
                        marcadorLocalizacao = L.marker(latLng, { icon: iconeMoto }).addTo(map)
                            .bindPopup("<b>Você está aqui</b>").openPopup();
                    }
                    map.setView(latLng, 15);

                    await fetch("/api/motoboy/atualizar-posicao", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ motoboy_nome: nomeMotoboy, latitude: lat, longitude: lng })
                    });
                }, (error) => {
                    console.error("Erro no GPS: ", error);
                }, { enableHighAccuracy: true });
            } else {
                alert("Geolocalização não é suportada pelo seu navegador.");
            }
        }
    </script>
</body>
</html>
