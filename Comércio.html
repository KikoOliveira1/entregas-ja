<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Comerciante - Entregas Já</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; box-sizing: border-box; }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        label { font-size: 14px; color: #555; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #218838; }
        #mensagem { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cadastrar Comerciante</h2>
        <form id="formComerciante">
            <label>Nome:</label>
            <input type="text" id="nome" required>

            <label>E-mail:</label>
            <input type="email" id="email" required>

            <label>Telefone:</label>
            <input type="text" id="telefone" required>

            <label>Endereço / Estabelecimento:</label>
            <input type="text" id="endereco" required>

            <button type="submit">Cadastrar</button>
        </form>
        <div id="mensagem"></div>
    </div>

    <script>
        document.getElementById('formComerciante').addEventListener('submit', async function(e) {
            e.preventDefault();
            const dados = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                endereco: document.getElementById('endereco').value
            };

            try {
                const response = await fetch('/api/cadastrar-comerciante', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await response.json();
                const msg = document.getElementById('mensagem');
                
                if (response.ok) {
                    msg.style.color = 'green';
                    msg.innerText = resultado.mensagem;
                    setTimeout(() => {
                        window.location.href = '/central-comerciante';
                    }, 1500);
                } else {
                    msg.style.color = 'red';
                    msg.innerText = "Erro ao cadastrar.";
                }
            } catch (err) {
                console.error("Erro:", err);
            }
        });
    </script>
</body>
</html>
